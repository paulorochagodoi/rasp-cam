<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#111">
  <title>Raspberry Pi Camera</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #111;
      color: #eee;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      flex-direction: column;
      height: 100dvh;
      overflow: hidden;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 16px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }

    #live-indicator {
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.5px;
      color: #888;
      transition: color 0.3s;
    }
    #live-indicator.connecting { color: #888; }
    #live-indicator.webrtc     { color: #4caf50; }
    #live-indicator.mjpeg      { color: #ff9800; }
    #live-indicator.error      { color: #f44336; }

    #mode-badge {
      font-size: 10px;
      padding: 2px 7px;
      border-radius: 10px;
      background: #2a2a2a;
      color: #aaa;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #000;
      overflow: hidden;
      position: relative;
    }

    #live-video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    #mjpeg-frame {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: none;
    }

    #stream-error {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      color: #666;
      font-size: 14px;
    }
    #stream-error.visible { display: flex; }
    #stream-error svg { opacity: 0.3; }

    #retry-btn {
      background: #333;
      border: 1px solid #444;
      color: #ccc;
      font-size: 13px;
      padding: 6px 16px;
      border-radius: 6px;
      cursor: pointer;
    }
    #retry-btn:hover { background: #3a3a3a; }
  </style>
</head>
<body>
  <header>
    <span id="live-indicator" class="connecting">● Conectando...</span>
    <span id="mode-badge">–</span>
  </header>

  <main>
    <video id="live-video" autoplay muted playsinline></video>
    <img id="mjpeg-frame" alt="camera stream">
    <div id="stream-error">
      <svg width="48" height="48" viewBox="0 0 24 24" fill="#fff">
        <path d="M17 10.5V7a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-3.5l4 4v-11l-4 4z"/>
      </svg>
      <p>Aguardando câmera...</p>
      <button id="retry-btn" onclick="startStream()">Tentar novamente</button>
    </div>
  </main>

  <script src="/static/app.js"></script>
</body>
</html>
